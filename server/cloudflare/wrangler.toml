# Cloudflare Worker config for the chess relay.
# Deploy with:  cd server/cloudflare && wrangler deploy
name = "chess-relay"
main = "worker.js"
compatibility_date = "2024-11-01"

# The relay rooms are Durable Objects.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# new_sqlite_classes (not new_classes) makes the Durable Object free-tier
# eligible. We don't use storage — it's just in-memory WebSocket coordination.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
