<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Puzzles</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#312e2b">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <main>
    <section class="board-col">
      <div id="board-wrap">
        <div id="board"></div>
        <div id="promo" hidden>
          <div id="promo-box"></div>
        </div>
      </div>
    </section>

    <aside class="panel">
      <h1>Puzzles</h1>
      <nav class="nav">
        <a href="index.html">Play</a>
        <a class="active" href="puzzles.html">Puzzles</a>
        <a href="openings.html">Openings</a>
        <a href="endgames.html">Endgames</a>
        <a href="online.html">Online</a>
      </nav>
      <div class="stats">
        <div class="stat"><b id="rating"></b><span id="rating-label">Rating</span></div>
        <div class="stat"><b id="streak"></b><span id="streak-label">Streak</span></div>
        <div class="stat"><b id="solved-count"></b><span id="solved-label">Solved</span></div>
      </div>
      <div class="controls">
        <label id="difficulty-wrap">Difficulty
          <select id="difficulty">
            <option value="auto">Auto — match my rating</option>
            <option value="easy">Easy (under 950)</option>
            <option value="medium">Medium (950–1400)</option>
            <option value="hard">Hard (1400–1800)</option>
            <option value="expert">Expert (1800+)</option>
          </select>
        </label>
        <label id="theme-wrap">Theme
          <select id="theme"></select>
        </label>
      </div>
      <div id="status"></div>
      <div id="feedback"></div>
      <div class="actions">
        <button id="hint" class="btn">Hint</button>
        <button id="next" class="btn primary">Skip →</button>
        <button id="rush" class="btn">⚡ Rush</button>
        <button id="rush-exit" class="btn" hidden>Exit Rush</button>
        <button id="playout" class="btn" hidden>▶ Play it out</button>
      </div>
    </aside>
  </main>

  <script src="chess-engine.js"></script>
  <script src="puzzles-data.js"></script>
  <script src="puzzles.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
